[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "procedural-kernel"
version = "0.1.3"
description = "Minimal deterministic procedural data kernel for game engines."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Brunno Benatti" }]
dependencies = [
  "pydantic>=2.0",
  "orjson>=3.10",
  "numpy>=2.0"
]

[project.optional-dependencies]
fast = ["numba>=0.60"]
analytics = ["polars>=1.0", "duckdb>=1.0"]
quality = ["hypothesis>=6.0"]
dev = ["pytest>=8.0", "ruff>=0.8"]

[project.scripts]
procedural-kernel = "procedural_kernel.cli:main"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
