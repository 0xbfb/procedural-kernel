[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ubu-version-governor"
version = "0.1.1"
description = "Executor ISO/3.1 E para commit, versionamento, branches e tags UBU."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "UBU" }]
license = { text = "MIT" }

[project.scripts]
ubu-version-governor = "ubu_version_governor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
